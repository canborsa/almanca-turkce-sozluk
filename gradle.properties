# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# https://docs.gradle.org/8.5/userguide/build_environment.html

# The Gradle Daemon allows Gradle to run faster by reusing computing resources.
# Zaten modern Gradle sürümlerinde varsayılan olarak etkindir.
org.gradle.daemon=true

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dkotlin.daemon.jvm.options="-Xmx2048m"

# When configured, Gradle will run in incubating parallel mode.
# Bu özellik, modern Gradle sürümlerinde varsayılan olarak etkindir.
org.gradle.parallel=true

# Enables new configuration caching feature with problems.
# org.gradle.unsafe.configuration-cache.problems=warn

# AndroidX'i etkinleştirir. Bu, hatayı düzeltecek anahtardır.
android.useAndroidX=true

# Jetifier'ı devre dışı bırakır. Sadece AndroidX bağımlılıkları kullandığımız için
# eski destek kütüphanelerini dönüştürmeye gerek yoktur.
android.enableJetifier=false

# Non-transitive R sınıflarını etkinleştirerek derleme performansını artırır.
android.nonTransitiveRClass=true

# Kotlin kod stilini belirler.
kotlin.code.style=official
